---
services:
  byparr:
    container_name: ms-byparr
    environment:
      TZ: "$TZ"
    image: ghcr.io/thephaseless/byparr:latest
    logging:
      driver: "$LOGGING_DRIVER"
    profiles:
      - anime
      - books
      - comics
      - movies
      - music
      - tv-shows
    restart: unless-stopped

  prowlarr:
    depends_on:
      - byparr
